name: docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "constraints/dev.txt"
      - "docs/**"
      - "pyproject.toml"
      - "vocalpy/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/dev.txt furo myst-parser sphinx sphinx-sitemap
      - name: Build Sphinx docs
        run: |
          python -m sphinx -W -b html docs docs/_build/html
      - name: Verify search metadata
        run: |
          grep -Fq '<link rel="canonical" href="https://vocalpy.gumadeiras.com/">' docs/_build/html/index.html
          grep -Fq '<loc>https://vocalpy.gumadeiras.com/_source/vocalpy.pipelines.html</loc>' docs/_build/html/sitemap.xml
          grep -Fq 'Sitemap: https://vocalpy.gumadeiras.com/sitemap.xml' docs/_build/html/robots.txt
          ! grep -Fq '/index.html</loc>' docs/_build/html/sitemap.xml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
