# --
# -- default values if no parameters are provided by the user
# --

pipelines:
  generic:
    identifier: False
    classifier: False
  mouse:
    identifier: True
    classifier: True
    min_contrast_db: 3.0
    nfft: 1024
    window_type: "hamming"
    window_size: 256
    noverlap: 128
    lower_frequency_cutoff: 45000
    higher_frequency_cutoff: 125000
    min_vocal_duration: 5
    max_vocal_duration: 250
  rat:
    identifier: True
    classifier: True
    min_contrast_db: 3.0
    nfft: 1024
    window_type: "hamming"
    window_size: 256
    noverlap: 128
    lower_frequency_cutoff: 18000
    higher_frequency_cutoff: 125000
    min_vocal_duration: 5
    max_vocal_duration: 750
  guineapig:
    identifier: True
    classifier: False
    min_contrast_db: 3.0
    nfft: 1024
    window_type: "barthann"
    window_size: 512
    noverlap: 256
    lower_frequency_cutoff: 250
    higher_frequency_cutoff: 20000
    min_vocal_duration: 5
    max_vocal_duration: 3000
